quarkus.http.port=8080

# DB (db-kind — build-time, поэтому без профиля)
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASS}
%prod.quarkus.datasource.reactive.url=vertx-reactive:postgresql://${DB_HOST}:5432/${DB_NAME}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
quarkus.datasource.jdbc.max-size=2

# Flyway: JDBC-пул только для миграций
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=keymaster
quarkus.flyway.default-schema=keymaster
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.default-schema=keymaster

%prod.keymaster.issuer=${JWT_ISSUER_MASTER}
%prod.keymaster.audience=${JWT_AUDIENCE}
%dev,test.keymaster.issuer=http://keymaster
%dev,test.keymaster.audience=gatekeeper

keymaster.password.argon2.iterations=2
keymaster.password.argon2.memory=19456
keymaster.password.argon2.parallelism=1
keymaster.password.argon2.max-concurrent-hashes=${CONCURRENT_HASHES:4}
keymaster.password.argon2.max-queue=${CONCURRENT_QUEUE:8}

# Logs
quarkus.log.level=INFO
quarkus.log.category."ru.zeker".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] [requestId=%X{requestId}] [userId=%X{userId}] [%c{3.}] %s%e%n

quarkus.hibernate-orm.mapping.format.global=ignore