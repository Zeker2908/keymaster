quarkus.http.port=8080

# DB (db-kind — build-time, поэтому без профиля)
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASS}
%prod.quarkus.datasource.reactive.url=vertx-reactive:postgresql://${DB_HOST}:5432/${DB_NAME}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
quarkus.datasource.jdbc.max-size=2
%dev,test.quarkus.hibernate-orm.log.sql=true

# Flyway: JDBC-пул только для миграций
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=keymaster
quarkus.flyway.default-schema=keymaster
quarkus.hibernate-orm.schema-management.strategy=none
%dev,test.quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.database.default-schema=keymaster

%prod.keymaster.issuer=${JWT_ISSUER_MASTER}
%prod.keymaster.audience=${JWT_AUDIENCE}
%dev,test.keymaster.issuer=http://keymaster
%dev,test.keymaster.audience=gatekeeper

# Keymaster
keymaster.issuer=${JWT_ISSUER}
keymaster.audience=${JWT_AUDIENCE}

# Password / Argon2
keymaster.password.argon2.iterations=${ARGON2_ITERATIONS:3}
keymaster.password.argon2.memory=${ARGON2_MEMORY:65536}
keymaster.password.argon2.parallelism=${ARGON2_PARALLELISM:1}
keymaster.password.argon2.max-concurrent-hashes=${ARGON2_MAX_CONCURRENT_HASHES:4}
keymaster.password.argon2.max-queue=${ARGON2_MAX_QUEUE:16}

# Bootstrap admin
keymaster.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
keymaster.bootstrap.admin.login=${BOOTSTRAP_ADMIN_LOGIN}
keymaster.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}

# Bootstrap signing key
keymaster.bootstrap.signing-key.enabled=${BOOTSTRAP_SIGNING_KEY_ENABLED:true}
%test.keymaster.bootstrap.signing-key.enabled=false

# Keys
keymaster.keys.jwks-poll-interval=PT300S
keymaster.keys.leeway=PT30S
keymaster.keys.max-access-ttl=PT15M
%dev,test.keymaster.keys.master-key=Ds3ccB4+gFE5OGiunazpLYqO2yzLxbwVIaNlWMmYex4=
%prod.keymaster.keys.master-key=${KEYMASTER_MASTER_KEY}

# Logs
%prod.quarkus.log.level=INFO
%dev,test.quarkus.log.level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] [requestId=%X{requestId}] [userId=%X{userId}] [%c{3.}] %s%e%n

quarkus.hibernate-orm.mapping.format.global=ignore